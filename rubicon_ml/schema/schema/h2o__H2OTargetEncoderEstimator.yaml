name: h2o__H2OTargetEncoderEstimator
extends: h2o__ModelBase
version: 1.0.0

compatibility:
  lightgbm:
    max_version:
    min_version: 3.44.0.1
docs_url: https://docs.h2o.ai/h2o/latest-stable/h2o-py/docs/modeling.html#h2otargetencoderestimator

artifacts:
  - self: log_h2o_model
parameters:
  - name: blending
    value_key: blending
  - name: columns_to_encode
    value_key: columns_to_encode
  - name: data_leakage_handling
    value_key: data_leakage_handling
  - name: fold_column
    value_key: fold_column
  - name: ignored_columns
    value_key: ignored_columns
  - name: inflection_point
    value_key: inflection_point
  - name: keep_original_categorical_columns
    value_key: keep_original_categorical_columns
  - name: noise
    value_key: noise
  - name: response_column
    value_key: response_column
  - name: seed
    value_key: seed
  - name: smoothing
    value_key: smoothing
