[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=61.0",
]

[project]
name = "rubicon-ml"
version = "0.15.3"
description = "AI/ML lifecycle metadata logger with configurable backends"
readme = "README.md"
license = { text = "Apache License, Version 2.0" }
authors = [
    { name = "Ryan Soley" },
    { name = "Capital One" },
]
requires-python = ">=3.10.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click<=8.5.0,>=7.1",
    "fsspec<=2026.9.0,>=2021.4.0",
    "numpy<=2.5.4,>=1.22.0",
    "pandas<=3.1.0,>=1.0.0",
    "pyarrow<=26.0.0,>=14.0.1",
    "pyyaml<=6.0.3,>=5.4.0",
    "scikit-learn<=1.9.1,>=0.22.0",
]
optional-dependencies.all = [
    "rubicon-ml[intake,jsonpath,s3,viz]",
]
optional-dependencies.build = [
    "build",
    "setuptools",
    "twine",
    "wheel",
]
optional-dependencies.dev = [
    "rubicon-ml[build,docs,intake,jsonpath,ops,s3,test,viz]",
]
optional-dependencies.docs = [
    "furo",
    "ipython",
    "nbsphinx",
    "numpydoc",
    "pandoc",
    "rubicon-ml[intake,jsonpath,viz]",
    "sphinx",
    "sphinx-copybutton",
]
optional-dependencies.intake = [
    "intake<=2.0.9,>=0.5.2",
]
optional-dependencies.jsonpath = [
    "jsonpath-ng<=1.15.0,>=1.5.3",
]
optional-dependencies.ops = [
    "bumpver",
    "edgetest",
    "pre-commit",
    "pyproject-fmt",
    "ruff<0.16.0",
]
optional-dependencies.s3 = [
    "s3fs<=2026.9.0,>=0.4",
]
optional-dependencies.test = [
    "dask[dataframe,distributed]<2025.4.0",
    "h2o<=3.46.0.11",
    "ipykernel",
    "jupyterlab",
    "kaleido>=1.0.0",
    "lightgbm",
    "nbconvert",
    "palmerpenguins",
    "pillow",
    "polars<1.0",
    "pytest",
    "pytest-cov",
    "wandb",
    "xgboost",
]
optional-dependencies.ui = [
    "rubicon-ml[viz]",
]
optional-dependencies.viz = [
    "dash<=2.18.2,>=2.11.0",
    "dash-bootstrap-components<=1.7.1,>=1.0.0",
]
urls."Bug Tracker" = "https://github.com/capitalone/rubicon-ml/issues"
urls."Source Code" = "https://github.com/capitalone/rubicon-ml"
urls.Documentation = "https://capitalone.github.io/rubicon-ml/"
scripts.rubicon_ml = "rubicon_ml.cli:cli"
entry-points."intake.drivers".rubicon_ml_dataframe_plot = "rubicon_ml.intake_rubicon.viz:DataframePlotDataSource"
entry-points."intake.drivers".rubicon_ml_experiment = "rubicon_ml.intake_rubicon.experiment:ExperimentSource"
entry-points."intake.drivers".rubicon_ml_experiment_table = "rubicon_ml.intake_rubicon.viz:ExperimentsTableDataSource"
entry-points."intake.drivers".rubicon_ml_metric_correlation_plot = "rubicon_ml.intake_rubicon.viz:MetricCorrelationPlotDataSource"
entry-points."intake.drivers".rubicon_ml_metric_list = "rubicon_ml.intake_rubicon.viz:MetricListComparisonDataSource"

[tool.setuptools]
packages.find.where = [
    ".",
]
packages.find.include = [
    "rubicon_ml*",
]
package-dir = { "" = "." }
include-package-data = true
package-data.rubicon_ml = [
    "py.typed",
    "schema/schema/*.yaml",
    "viz/assets/*",
    "viz/assets/css/*",
]

[tool.ruff]
line-length = 100
exclude = [
    ".ipynb_checkpoints",
    ".venv",
    "binder",
    "build",
    "docs",
    "notebooks",
]

[tool.pyproject-fmt]
column_width = 1
indent = 4
keep_full_version = true

[tool.pytest]
ini_options.minversion = "3.2"
ini_options.addopts = "--cov=./rubicon_ml --cov-fail-under=90 --cov-report=term-missing -m='not write_files and not wandb'"
ini_options.markers = [
    "run_notebooks: tests that run Jupyter notebooks",
    "wandb: tests that connect to Weights & Biases",
    "write_files: tests that physically write files to local and S3 filesystems",
]
ini_options.xfail_strict = true

[bumpver]
current_version = "0.15.3"
version_pattern = "MAJOR.MINOR.PATCH"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"rubicon_ml/__init__.py" = [
    '__version__ = "{version}"',
]

[edgetest.envs.core]
python_version = "3.12"
extras = [
    "dev",
]
upgrade = [
    "click",
    "fsspec",
    "jsonpath-ng",
    "numpy",
    "pandas",
    "pyarrow",
    "PyYAML",
    "s3fs",
    "scikit-learn",
]
command = "pytest"
